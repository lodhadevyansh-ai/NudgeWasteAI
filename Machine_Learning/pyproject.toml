[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nudgewaste-ml"
version = "1.0.0"
description = "Machine Learning package for NudgeWasteAI"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]

[tool.pyright]
extraPaths = [".", ".."]

